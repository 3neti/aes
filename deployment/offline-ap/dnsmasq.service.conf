[Unit]
Requires=hostapd.service waes-ap-firewall.service
After=hostapd.service waes-ap-firewall.service

[Service]
Type=simple
PIDFile=
ExecStartPre=
ExecStartPre=/usr/sbin/dnsmasq --test --conf-file=/etc/waes/dnsmasq-ap.conf
ExecStart=
ExecStart=/usr/sbin/dnsmasq --keep-in-foreground --conf-file=/etc/waes/dnsmasq-ap.conf --pid-file=
ExecStartPost=
ExecStop=
ExecStopPost=
